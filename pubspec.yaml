name: ironcoach
description: >
  IronCoach — an AI-powered, offline-first fitness platform: workouts,
  nutrition, progress tracking, gamification, social, and specialized
  AI coaches, built on Flutter + Supabase.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.9

  # Models / codegen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local persistence / offline-first
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Networking
  dio: ^5.4.3+1
  rxdart: ^0.28.0

  # UI
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  image_picker: ^1.1.2
  mobile_scanner: ^5.1.1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3
  table_calendar: ^3.1.2

  # Notifications
  flutter_local_notifications: ^17.2.1+2
  timezone: ^0.9.4

  # Utils
  equatable: ^2.0.5
  collection: ^1.18.0
  logger: ^2.4.0
  uuid: ^4.4.2
  fpdart: ^1.1.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env
